objective: >
  Implement Blueprint §7's eight-stage verification pipeline
  (filesystem evidence → diff verification → build → tests → lint/
  typecheck → requirement verification → Mission Acceptance Contract
  check → checkpoint accepted) with genuine short-circuiting, and a
  command-execution boundary for the Build/Tests/Lint stages that
  implements every part of §7.1's sandbox model this task can honestly
  deliver in this environment — while being completely explicit, in
  code and in this report, about the one part it cannot: real OS-level
  process-tree containment (Windows job objects / Unix namespaces or
