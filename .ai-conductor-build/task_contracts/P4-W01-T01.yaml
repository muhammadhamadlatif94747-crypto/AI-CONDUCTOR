inputs:
  - "Blueprint §7's eight-stage pipeline diagram, reproduced as an
     ordered enum with genuine short-circuiting."
  - "Blueprint §7.1's sandbox requirement list, implemented wherever
     achievable without OS-level primitives, and explicitly NOT
     implemented (and stated as such) wherever it isn't."

outputs:
  - "conductor-kernel::verification -- VerificationStage (the eight
     stages, verbatim), StageStatus, StageOutcome, PipelineResult,
     RequirementVerificationClass (Blueprint SS7, three variants,
     verbatim), Requirement (minimal), run_pipeline(...) ->
     PipelineResult; VerificationCommand, SandboxError,
     run_verification_command(...) -> Result<CommandOutcome, SandboxError>
     (the partial, explicitly-labeled sandbox)."

implementation_requirements:
  - "run_pipeline executes stages in Blueprint §7's exact order and
     genuinely short-circuits: a failed stage causes every later stage to
     report StageStatus::SkippedDueToEarlierFailure rather than running
     -- proven directly (a stage's own logic must never execute after an
     earlier failure), not merely documented as intended behavior."
  - "run_verification_command enforces, for real: (1) a command allowlist
     -- only recognized build/test/lint runner prefixes, anything else
     rejected before spawning; (2) working-directory confinement --
     canonicalized and checked to be inside the given worktree root
     before running, rejected otherwise; (3) a real timeout -- a
     poll-loop against Child::try_wait() with a deadline, killing the
     child if exceeded (this kills the immediate child only, NOT its
     full descendant process tree -- stated as a known limitation
     inherited from not having OS-level containment, not silently
     assumed sufficient); (4) environment filtering via
     Command::env_clear() plus an explicit allowlist of variables the
     runner actually needs (e.g. PATH), so anything not explicitly
     allowed -- including anything a future Credential Vault would
     manage -- is never inherited."
  - "Mutation detection for commands explicitly marked read-only-intended
     (lint/typecheck stages) reuses Baseline::capture/diff (P2-W02): if
     the workspace changed during a command that claimed not to touch
     it, that is itself reported as a SandboxError, not silently
     ignored."
  - "RequirementVerificationClass::ModelAssisted structurally cannot, by
     itself, satisfy a blocking requirement -- proven by a test that
     constructs a blocking requirement backed only by ModelAssisted
     evidence and confirms the requirement-verification stage reports it
     unsatisfied, matching Blueprint §7's exact stated rule."

invariants_preserved: ["1", "2", "6", "7", "8", "11", "13", "14"]
invariants_proven: ["7"]

required_tests:
  - "cargo test: the eight stages run in Blueprint's exact order for an
     all-pass pipeline; a failure at any given stage causes every later
     stage to be skipped, not run (tested for at least the build/test
     boundary and the requirement-verification/MAC-check boundary, the
     two short-circuit points most likely to be gotten wrong); the
     command allowlist rejects an unrecognized command; working-directory
     confinement rejects a path outside the worktree; the timeout
     actually kills a long-running child within a bounded, deterministic
     wait (not a flaky real-time-dependent sleep); environment filtering
     proves an arbitrary env var set on the test process is NOT visible
     to the child process; mutation detection catches a read-only-marked
     command that actually wrote to the workspace; ModelAssisted alone
     cannot satisfy a blocking requirement."

acceptance:
