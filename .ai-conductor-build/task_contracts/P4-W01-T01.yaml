forbidden_actions:
  - "editing governing documents"
  - "claiming, in any doc comment, report, or test name, that the command
     sandbox built here is secure against an adversarial/malicious
     command. It is NOT. §7.1 is explicit that a command allowlist alone
     is not a sandbox unless containment applies to the whole process
     tree, enforced at the OS namespace/job-object level -- this task
     does not implement that. What IS implemented (allowlist,
     working-directory confinement, a real timeout, environment-variable
     allowlisting via env_clear, and mutation detection reusing P2-W02's
     Baseline) is a genuine, tested, but explicitly PARTIAL safeguard,
     sufficient for running trusted/expected build-tool commands and
     catching accidental misbehavior, NOT sufficient to safely run an
     untrusted or adversarial acceptance-contract command. This
     distinction must be stated plainly everywhere the sandbox is
     described, not softened."
  - "implementing real OS-level process-tree containment (job objects /
     namespaces / cgroups) -- this is a substantial, platform-specific
     systems-security undertaking that Blueprint SS7.1 itself says needs
     'a dedicated test that deliberately tries to escape it.' Attempting
     it inside this single task, in this sandboxed environment, without
     the ability to properly validate OS-level isolation primitives on
     each target platform, risks producing exactly the false-confidence
     artifact this whole document exists to prevent: something that
     LOOKS like a sandbox but is not proven to contain a determined
     escape attempt. Deferred explicitly to a dedicated future task with
     its own contract, its own platform-specific validation, and its own
     escape-attempt test suite."
  - "implementing network isolation -- blocking a child process's network
     access without OS-level firewalling/namespace primitives is not
     achievable via std::process::Command alone; not implemented, not
     claimed to be implemented"
  - "implementing the full RequirementVerificationClass / Mission
     Acceptance Contract JSON schema (ids, descriptions, evidence
     provenance/freshness requirements) -- Blueprint SS8's full schema is
     explicitly P4-W03's job. This task defines RequirementVerificationClass
     verbatim (three variants) and a minimal Requirement type just
     sufficient to drive the requirement-verification stage's pass/fail
     logic and the 'ModelAssisted alone can never satisfy blocking' rule
     -- not the full contract schema."
  - "implementing full structured Evidence with provenance/freshness
     (Blueprint SS4.5) -- explicitly P4-W02's job. Each stage in this
     task produces a minimal StageOutcome (stage, status, detail), not
     the full Evidence record type."
  - "setting AttemptStatus::Succeeded from pipeline logic, directly or
     indirectly -- this task produces a PipelineResult (Pass/Fail); it
     does not touch AttemptStatus at all. Wiring the pipeline's result to
     the actual protected Succeeded transition is explicitly P4-W04's
     job (Invariant 14)."

dependencies:
  - "P2-W02-T01 (Baseline) -- mutation detection for read-only-intended
