risk_level: high
risk_notes: >
  This is the first task in the crate whose own subject matter is a
  security boundary, not just reliability logic. The dominant risk is
  not a bug in the usual sense -- it's the sandbox being described or
  perceived as more secure than it actually is, which would be exactly
  the false-confidence failure mode this whole Blueprint exists to
  prevent, applied to security rather than correctness. Mitigated by
  stating the gap (no OS-level process-tree containment, no network
  isolation) explicitly and repeatedly -- in the module's own doc
  comment, in this contract, and in the verification report -- rather
  than once and then left to be forgotten. This module must not be
  treated as safe to run against untrusted acceptance-contract commands
  until the deferred OS-level containment task exists and passes its own
  escape-attempt tests.

done_when:
