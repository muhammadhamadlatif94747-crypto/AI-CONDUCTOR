# Task Contract — P4-W03-T01

```yaml
contract_version: 1
id: P4-W03-T01
phase: P4
status: IMPLEMENTED

authority:
  blueprint: "2.5.1"
  protocol: "1.1"
  phase_manifest: "1.1"

section_refs:
  - "Blueprint §8 (Mission Acceptance Contracts — the criterion JSON
     shape, the full-contract example, and the enforcement flow diagram)"
  - "Phase Manifest §8.3 P4-W03 (\"Enforce Mission Acceptance Contracts
     before an Attempt may become Succeeded\")"
  - "Phase Manifest §8.5 (P4 gate: \"No code path other than the
     Verification Engine may create Succeeded... All required acceptance
     criteria must be tied to explicit verification methods and required
     evidence\")"

objective: >
  Implement Blueprint §8's Mission Acceptance Contract schema (criteria
  with declared verification method + required evidence provenance/
  freshness, exactly as the worked JSON example shows) and a real
  enforcement function that checks a contract against actual produced
  Evidence (P4-W02) — reusing `Evidence::matches` directly rather than
  re-deriving provenance/freshness matching a second time. Missing
  evidence for a criterion fails that criterion; a non-blocking
  criterion's failure is recorded but does not fail the contract.

allowed_files:
  - "PROJECT/crates/conductor-kernel/**"
  - ".ai-conductor-build/task_contracts/P4-W03-T01.yaml"
  - ".ai-conductor-build/verification_reports/P4-W03-T01.md"
  - ".ai-conductor-build/BUILD_STATE.json"

forbidden_files:
  - "BLUEPRINT/**"
  - "GOVERNANCE/**"
  - "FAILURE_MEMORY/**"
  - "KNOWLEDGE/**"
  - "48 HOURS/**"

forbidden_actions:
  - "editing governing documents"
  - "setting AttemptStatus::Succeeded from this module, directly or
     indirectly -- this task produces a MacEvaluationResult (pass/fail
     per criterion, overall pass/fail); it does not touch AttemptStatus
     at all. Wiring an evaluation's result to the actual protected
     Succeeded transition is explicitly P4-W04's job (Invariant 14,
     restated by Phase Manifest SS8.5: 'No code path other than the
     Verification Engine may create Succeeded')."
  - "modifying P4-W01's verification.rs pipeline or its minimal
     Requirement type to use this task's richer MAC schema -- P4-W01 is
     already ACCEPTED and its own contract explicitly deferred 'the full
     MAC schema' to this task; reopening an accepted module to swap in a
     richer type it didn't ask for is not this task's job. This task
     delivers the real schema as its own module, ready for a future
     orchestration task to wire in, the same way P4-W01 itself deferred
     to it."
  - "treating a criterion with no evidence provided as vacuously
     satisfied -- fail closed, matching this crate's established
     discipline in every prior module (baseline.rs, worktree.rs,
     provider.rs's ScriptExhausted, etc.)"
  - "inventing additional VerificationType variants beyond the five
     Blueprint §8's own worked full-contract example actually names
     (dom_check, test_command, integration_test, test_suite_diff,
     diff_scope_check) -- this is the concrete, complete set the
     Blueprint text provides; extending it with plausible-sounding
     additions not shown in the text would misrepresent what's
     authoritative Blueprint content versus this task's own invention"

dependencies:
  - "P4-W02-T01 (Evidence) -- RequiredEvidenceSpec reuses
     EvidenceProvenance directly and enforcement reuses Evidence::matches
     directly, rather than re-deriving provenance/freshness matching."

preconditions:
  - "Phase 4 active; P4-W01 and P4-W02 accepted."

inputs:
  - "Blueprint §8's criterion JSON shape and full-contract worked example,
     reproduced as Rust types matching the shown fields exactly."

outputs:
  - "conductor-kernel::mission_acceptance -- VerificationType (5
     variants, Blueprint's own named set), ExpectedResult
     (ExitCodeZero, plus an Other(String) fallback for anything the
     Blueprint's single shown example doesn't cover -- documented as an
     interpretation), Criterion, MissionAcceptanceContract,
     CriterionResult, MacEvaluationResult, and
     evaluate_contract(&MissionAcceptanceContract, &HashMap<String,
     Evidence>, now_ms: u64) -> MacEvaluationResult."

implementation_requirements:
  - "Criterion's fields match Blueprint §8's JSON example exactly: id,
     description, verification (type + optional command +
     expected_result), required_evidence (provenance +
     max_freshness_seconds + execution_id), blocking."
  - "evaluate_contract checks each criterion's evidence (looked up by
     criterion id) against required_evidence via Evidence::matches
     (P4-W02) -- reused directly, not re-implemented. A criterion with no
     corresponding evidence entry fails, explicitly, not silently passes."
  - "A blocking criterion's failure makes the whole contract fail
     (all_blocking_satisfied: false). A non-blocking criterion's failure
     is recorded in CriterionResult but does not, by itself, fail the
     contract -- proven by a dedicated test distinguishing the two."
  - "MacEvaluationResult carries per-criterion detail (which criteria
     passed, which failed and why -- missing evidence vs. a real
     Evidence::matches mismatch are distinguishable in the result), not
     just a single overall boolean -- so a future caller (or a person)
     has real information about what's unmet, matching Blueprint §8's
     own flow diagram: 'FAIL → specific unmet criteria become the next
     repair request — never a vague try again.'"

invariants_preserved: ["1", "2", "6", "7", "8", "11", "13", "14"]
invariants_proven: []

required_tests:
  - "cargo test: a contract with all criteria satisfied by matching
     evidence passes; a blocking criterion with no evidence fails the
     contract; a blocking criterion whose evidence exists but doesn't
     match (wrong provenance/stale/wrong execution_id, reusing P4-W02's
     own proven Evidence::matches) fails the contract; a non-blocking
     criterion's failure does NOT fail the contract, proven directly
     against a case that would otherwise look identical to a failing
     blocking one; MacEvaluationResult correctly distinguishes
     missing-evidence from evidence-that-doesn't-match in its per-
     criterion detail; Blueprint's own seven-criterion 'auth' worked
     example is reproduced as a literal contract and evaluated end to
     end."

acceptance:
  - "All VG-P4-W03-T01 proofs evidenced in verification report."

non_goals:
  - "Wiring evaluation results into the verification pipeline (P4-W01,
     already accepted, not reopened); the protected Succeeded transition
     (P4-W04); actually running the declared verification commands (that
     is P4-W01's run_verification_command's job, composed by whichever
     future orchestrator drives a real attempt through both)."

risk_level: medium
risk_notes: >
  This module's evaluation result is the last real gate before whatever
  future orchestration task wires it to Succeeded (P4-W04) -- a
  correctness bug here (e.g. a non-blocking failure incorrectly failing
  the whole contract, or missing evidence being treated as satisfied)
  would be a real reliability regression, not just a missing feature.
  Mitigated by testing the missing-evidence and non-blocking-failure
  cases explicitly rather than only the straightforward all-pass case.

done_when:
  - "Blueprint's own seven-criterion worked example is reproduced and
     evaluated end to end. Missing evidence for a blocking criterion is
     proven to fail the contract, not pass it. A non-blocking criterion's
     failure is proven NOT to fail the contract, distinguished directly
     from the blocking case. Evidence::matches (P4-W02) is reused, not
     re-implemented."
```
