     for minimal new dependencies (no uuid, no async runtime added by
     prior tasks either) and because the ONLY property actually required
     here is exact seeded reproducibility, which a simple PRNG provides
     just as well as a general-purpose crate would."
  - "persisting chaos run records (chaos_seed/scenario_id/virtual_time_seed)
     as durable events -- ChaosConfig exposes these fields for a caller to
