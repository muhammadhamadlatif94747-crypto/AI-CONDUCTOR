     recording and persisting a real executor's snapshot durably is
     explicitly the next task's job."
  - "referencing crate::state or crate::conflict from this module at all
     -- the Hard Authority Rules (SS11: no direct Succeeded, no merge
     authorization, no Conflict resolution) are upheld by this module
     having literally no access to those types, not by a runtime check
     that could be bypassed."
  - "implementing a real secret-redaction engine for evidence collection
     (SS9's 'secrets must be redacted') -- no real executor output
     exists yet to redact from meaningfully; documented as the calling
     code's responsibility when real evidence collection is built
     against a real executor (P5-W03+), not invented here without
     something real to validate the redaction against."

