  - "ExecutionState has exactly the 9 states §5's diagram shows,
     including Unknown as a first-class variant (not an Option::None) --
     §5: 'Unknown is mandatory... report Unknown rather than invent
     Failed or Completed.'"
  - "FinalizationClaim is a DIFFERENT type from ExecutionState (not a
     reused/aliased enum), and its variants are named *Claim
     (CompletedClaim/FailedClaim/CancelledClaim/UnknownClaim) --
     reinforcing §10's 'It does NOT authorize acceptance' at the type
     level: a FinalizationClaim cannot be mistaken for or silently
     substituted for an authoritative AttemptStatus."
  - "The ExecutionAdapter trait's method set (identity, capabilities,
     start, observe, cancel, collect_evidence, finalize) has no method
     that accepts or returns any crate::state or crate::conflict type --
     verified by this module having zero `use crate::state::*` /
     `use crate::conflict::*` imports (grep-audited in the report)."
  - "FakeExecutionAdapter is script-driven (mirroring provider.rs's
     FakeProvider design precedent) and demonstrably implements the full
     trait -- proven by a test that uses it purely through &dyn
     ExecutionAdapter, not by calling its concrete methods directly."

